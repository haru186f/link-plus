{% extends "base.html" %}
{% load static %}


{% block title %}ログイン{% endblock title %}
{% block css %}<link rel="stylesheet" href="{% static 'registration/login.css' %}">{% endblock css %}
{% block script %}{% endblock script %}


{% block content %}

<h2>ログイン</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">ログイン</button>
</form>
{% comment %} <a href="{% url 'signup' %}">新規登録はこちら</a> {% endcomment %}

{% endblock content %}
