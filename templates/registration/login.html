{% extends "base.html" %}


{% block title %}ログイン{% endblock title %}


{% block content %}

<h2>ログイン</h2>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <p>{{ form.username.label_tag }} {{ form.username }}</p>
    <p>{{ form.password.label_tag }} {{ form.password }}</p>
    <button type="submit">ログイン</button>
</form>
<a href="{% url 'signup' %}">新規登録はこちら</a>

{% endblock content %}
