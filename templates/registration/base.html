{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link plus | {% block title %}{% endblock title %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" defer></script>

  {% block css %}{% endblock css %}
  {% block script %}{% endblock script %}
</head>
<body>

  <main class="min-vh-100 d-flex align-items-center justify-content-center bg-gradient">
    <div class="container">
      <div class="card shadow-lg border-0 rounded-4 mx-auto p-4 glass-card">
        {% block content %}{% endblock content %}
      </div>
    </div>
  </main>

  <style>
    /* 背景グラデーション */
    .bg-gradient {
      background: linear-gradient(135deg, #f3f6f9 0%, #eaf4ff 50%, #f0ebff 100%);
    }

    /* ガラスカード（全体を80%サイズに） */
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      max-width: 600px;
      padding: 2rem 2.5rem;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.1);
    }

    /* 見出し共通 */
    h1, h2, h3 {
      text-align: center;
      color: #333;
      font-weight: 600;
      margin-bottom: 1.2rem;
    }

    /* 入力欄 */
    input.form-control {
      border-radius: 0.8rem;
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
      border: 1px solid #ced4da;
      transition: all 0.3s ease;
    }

    input.form-control:focus {
      border-color: #80bdff;
      box-shadow: 0 0 6px rgba(0, 123, 255, 0.25);
    }

    /* レスポンシブ対応 */
    @media (max-width: 768px) {
      .glass-card {
        padding: 1.5rem;
        max-width: 90%;
      }
    }
  </style>
</body>
</html>
