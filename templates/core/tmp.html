{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🚌 バス残り時間</title>
    <style>
        body {
            font-family: "Segoe UI", "Hiragino Sans", sans-serif;
            background: #f9fafb;
            color: #333;
            margin: 2rem auto;
            max-width: 600px;
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 0.5rem;
        }
        th, td {
            padding: 0.8rem;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #2563eb;
            color: white;
        }
        tr:last-child td { border-bottom: none; }
        .note { color: #666; font-style: italic; }
        #clock {
            margin-top: 1rem;
            font-size: 1.1rem;
            font-weight: bold;
            color: #2563eb;
        }
    </style>
</head>
<body>
    <h1>🚌 バス残り時間（リアルタイム更新）</h1>

    <table id="bus-table">
        <thead>
            <tr>
                <th>バス停</th>
                <th>出発</th>
                <th>下校</th>
            </tr>
        </thead>
        <tbody>
            {% for name, info in bus_data.items %}
            <tr data-bus="{{ name }}">
                <td>{{ name }}</td>
                <td class="departure">{{ info.departure }}</td>
                <td class="return">{{ info.return }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p style="margin-top:1rem; font-size:0.9rem; color:#777;">
        ※ 現在時刻が変わったときに自動更新されます
    </p>

    <!-- 🕒 現在時刻を表示 -->
    <p id="clock"></p>

    <script>
        // 🚍 残り時間を更新
        async function updateBusTimes() {
            try {
                const response = await fetch("{% url 'bus:next_bus_times' %}", {
                    headers: { "x-requested-with": "XMLHttpRequest" }
                });
                if (!response.ok) throw new Error("サーバー通信エラー");
                const data = await response.json();

                Object.entries(data).forEach(([busName, info]) => {
                    const row = document.querySelector(`tr[data-bus="${busName}"]`);
                    if (row) {
                        row.querySelector(".departure").textContent = info.departure || "-";
                        row.querySelector(".return").textContent = info.return || "-";
                    }
                });
            } catch (err) {
                console.error("更新エラー:", err);
            }
        }

        // ⏰ 現在時刻を1秒ごとに表示
        function updateClock() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, "0");
            const mm = String(now.getMinutes()).padStart(2, "0");
            const ss = String(now.getSeconds()).padStart(2, "0");
            document.getElementById("clock").textContent = `現在時刻：${hh}:${mm}:${ss}`;
        }

        // 🕐 分が変わったタイミングで更新
        function startMinuteWatcher() {
            let lastMinute = new Date().getMinutes();

            setInterval(() => {
                const now = new Date();
                updateClock(); // 時刻も毎秒更新

                if (now.getMinutes() !== lastMinute) {
                    lastMinute = now.getMinutes();
                    console.log("分が変わったので更新します");
                    updateBusTimes();
                }
            }, 1000);
        }

        // 初回読み込み時に実行
        updateBusTimes();
        startMinuteWatcher();
    </script>
</body>
</html>
